      <section>
        <div class="container-text-contact">
          <h1>Võta ühendust Minuga</h1>
          <p class="form-subtitle">Palun täida all olev vorm</p>

          <form action="">
            <div class="form-group">
              <label for="name">Nimi</label>
              <input type="text" id="name" name="name" value="Nimi" />
            </div>

            <div class="form-group">
              <label for="email">Email</label>
              <input
                type="email"
                id="email"
                name="email"
                value="Nimi@naide.com"
              />
            </div>

            <div class="form-group">
              <label for="message">Sõnum</label>
              <textarea id="message"></textarea>
            </div>

            <button type="submit" class="btn">Saada</button>
          </form>
        </div>
      </section>
    </main>
